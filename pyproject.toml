[project]
name = "foreman-mcp"
version = "0.1.0"
description = "A least-privilege MCP server that gives coding agents audited, budgeted access to your repositories, tests and CI, with human approval for anything that writes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "William Widener" }]
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
foreman = "foreman.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foreman"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
